---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.staticanalysis.pmd.ModernizePmd
displayName: Modernize a PMD ruleset
description: >-
  Bring a PMD ruleset XML file up to date with current PMD, by updating the `<rule>` references and `<exclude>` elements
  to name each rule as PMD knows it today. This runs both the PMD 6 to 7 migration, which replaces the rules PMD 7
  deleted and drops the ones deleted without a successor, and the PMD 7 rule renames, which adopt the current name of
  each rule PMD renamed within the PMD 7 line. Rules whose replacement requires a judgement call, either because PMD
  split one rule across several successors or because the successor reports something different, are left alone. The
  result requires PMD 7.27.0 or later; an earlier PMD 7 fails to load a name that its version does not know yet.
recipeList:
  - org.openrewrite.staticanalysis.pmd.Pmd6to7Migration
  - org.openrewrite.staticanalysis.pmd.Pmd7RuleRenames

---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.staticanalysis.pmd.Pmd6to7Migration
displayName: Migrate a PMD 6 ruleset to PMD 7
description: >-
  PMD 7 deleted the rules that had been deprecated throughout the PMD 6 line, and PMD refuses to load a ruleset that
  references a rule it does not know. Update the `<rule>` references and `<exclude>` elements in PMD ruleset XML files
  to name each deleted rule's successor, and drop the references to rules that were deleted without one. Rules whose
  behaviour PMD split across several successors, such as `VariableNamingConventions` and the primitive wrapper
  `*Instantiation` rules, are left alone because picking a single replacement for them requires a judgement call.
recipeList:
  # Rules PMD 7 deleted in favor of a single successor
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/PositionLiteralsFirstInCaseInsensitiveComparisons
      newRule: LiteralsFirstInComparisons
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/PositionLiteralsFirstInComparisons
      newRule: LiteralsFirstInComparisons
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/UnusedImports
      newRule: category/java/codestyle.xml/UnnecessaryImport
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/UseAssertEqualsInsteadOfAssertTrue
      newRule: SimplifiableTestAssertion
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/UseAssertNullInsteadOfAssertEquals
      newRule: SimplifiableTestAssertion
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/UseAssertSameInsteadOfAssertEquals
      newRule: SimplifiableTestAssertion
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/bestpractices.xml/UseAssertTrueInsteadOfAssertEquals
      newRule: SimplifiableTestAssertion
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/codestyle.xml/AbstractNaming
      newRule: ClassNamingConventions
  - org.openrewrite.staticanalysis.pmd.ReplacePmdRule:
      oldRule: category/java/codestyle.xml/AvoidPrefixingMethodParameters
