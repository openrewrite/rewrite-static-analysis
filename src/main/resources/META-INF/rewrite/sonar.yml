---
type: specs.openrewrite.org/v1beta/recipe
name: org.openrewrite.staticanalysis.sonar.SonarRules
displayName: Sonar rules for static analysis
description: Fixes or flags code reported by SonarQube Java rules, grouped by the default Sonar severity of each rule.
preconditions:
  - org.openrewrite.Singleton
  - org.openrewrite.FindSourceFiles:
      filePattern: "**/*.java"
recipeList:
  - org.openrewrite.staticanalysis.sonar.Blocker
  - org.openrewrite.staticanalysis.sonar.Critical
  - org.openrewrite.staticanalysis.sonar.Major
  - org.openrewrite.staticanalysis.sonar.Minor
---
